[project]
name = "options-trading-plan"
version = "0.0.1"
description = "Evidence-first, VRP-aware covered options screening pipeline"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "yfinance~=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "black~=24.0",
    "ruff~=0.16.4",
]

[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.ruff]
line-length = 120
target-version = "py314"
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
